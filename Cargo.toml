[workspace]
members = ["crates/rules", "crates/protocol", "crates/bots", "crates/desktop", "crates/server"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
resourceville-rules = { path = "crates/rules" }
resourceville-protocol = { path = "crates/protocol" }
eframe = { version = "=0.32.3", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "x11", "wayland"] }
axum = "=0.8.6"
tokio = { version = "=1.47.1", features = ["macros", "rt-multi-thread", "net", "signal"] }

[profile.release]
strip = true
lto = "thin"
