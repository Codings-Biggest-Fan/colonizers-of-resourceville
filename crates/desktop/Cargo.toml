[package]
name = "resourceville-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
capture = []

[dependencies]
eframe.workspace = true
wgpu = { version = "=25.0.2", default-features = false, features = ["dx12", "metal", "vulkan", "gles", "wgsl"] }
resourceville-protocol.workspace = true
resourceville-rules.workspace = true
image = { version = "=0.25.10", default-features = false, features = ["png"] }

resvg = { version = "=0.45.1", default-features = false, features = ["text"] }
